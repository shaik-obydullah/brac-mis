name: brac_mis

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: brac_mis_app
    restart: "no"
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=brac_mis
      - DB_USERNAME=brac_mis_user
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    networks:
      - brac_mis_network

  nginx:
    image: nginx:1.27-alpine
    container_name: brac_mis_nginx
    restart: "no"
    ports:
      - "8087:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - brac_mis_network

  mysql:
    image: mysql:8.0
    container_name: brac_mis_mysql
    restart: "no"
    ports:
      - "3309:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=brac_mis
      - MYSQL_USER=brac_mis_user
      - MYSQL_PASSWORD=secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - brac_mis_network

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: brac_mis_phpmyadmin
    restart: "no"
    ports:
      - "8089:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - UPLOAD_LIMIT=100M
    depends_on:
      - mysql
    networks:
      - brac_mis_network

  redis:
    image: redis:7.4-alpine
    container_name: brac_mis_redis
    restart: "no"
    ports:
      - "6383:6379"
    volumes:
      - redis_data:/data
    networks:
      - brac_mis_network

networks:
  brac_mis_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
